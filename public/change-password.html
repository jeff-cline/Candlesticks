<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change your password — Candlesticks.ai</title>
<link rel="stylesheet" href="/css/main.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<style>
  body { display: grid; place-items: center; min-height: 100vh; padding: 24px; }
  .auth { width: 100%; max-width: 430px; }
  .auth .logo { justify-content: center; margin-bottom: 26px; font-size: 1.2rem; }
  .meter { height: 4px; background: var(--surface-3); border-radius: 999px; overflow: hidden; margin-top: 7px; }
  .meter i { display: block; height: 100%; width: 0; background: var(--red); transition: .25s; }
</style>
</head>
<body>
<main class="auth">
  <a href="/" class="logo">
    <svg class="logo-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <rect x="3" y="7" width="4" height="11" rx="1" fill="#3987e5"/>
      <rect x="10" y="10" width="4" height="6" rx="1" fill="#d03b3b"/>
      <rect x="17" y="5" width="4" height="9" rx="1" fill="#9085e9"/>
    </svg>
    Candlesticks<span class="dim">.ai</span>
  </a>

  <div class="alert alert-warn">
    <div class="alert-icon">🔐</div>
    <div>
      <p class="alert-title">Password change required</p>
      <p>You're signed in with a temporary password. Choose a new one before continuing.</p>
    </div>
  </div>

  <div class="card">
    <form id="pw-form">
      <div class="field">
        <label for="current">Current (temporary) password</label>
        <input id="current" name="currentPassword" type="password" required autocomplete="current-password" autofocus>
      </div>
      <div class="field">
        <label for="next">New password <span class="dim">(12+ characters)</span></label>
        <input id="next" name="newPassword" type="password" required minlength="12" autocomplete="new-password">
        <div class="meter"><i id="meter"></i></div>
      </div>
      <div class="field">
        <label for="confirm">Confirm new password</label>
        <input id="confirm" name="confirmPassword" type="password" required minlength="12" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%">Set password &amp; continue</button>
    </form>
  </div>
</main>

<div class="toast" id="toast"></div>
<script>
const $ = (s) => document.querySelector(s);
let t;
function toast(msg, kind = '') {
  const el = $('#toast');
  el.textContent = msg;
  el.className = `toast show ${kind}`;
  clearTimeout(t);
  t = setTimeout(() => { el.className = 'toast'; }, 5200);
}

$('#next').addEventListener('input', (e) => {
  const v = e.target.value;
  let score = 0;
  if (v.length >= 12) score++;
  if (v.length >= 16) score++;
  if (/[a-z]/.test(v) && /[A-Z]/.test(v)) score++;
  if (/\d/.test(v)) score++;
  if (/[^\w\s]/.test(v)) score++;
  const pct = (score / 5) * 100;
  const bar = $('#meter');
  bar.style.width = pct + '%';
  bar.style.background = score <= 2 ? 'var(--red)' : score <= 3 ? 'var(--amber)' : 'var(--green)';
});

$('#pw-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('button');
  btn.disabled = true;
  btn.textContent = 'Saving…';
  try {
    const res = await fetch('/auth/change-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.fromEntries(new FormData(e.target))),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not change password');
    window.location.href = data.redirect || '/app';
  } catch (err) {
    toast(err.message, 'error');
    btn.disabled = false;
    btn.textContent = 'Set password & continue';
  }
});
</script>
</body>
</html>
